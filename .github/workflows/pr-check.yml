name: PR Validation

on:
  pull_request:
    types: [opened, edited, labeled, unlabeled, synchronize]

# The github-script steps call issues.get and pulls.get. Without this block the
# GITHUB_TOKEN runs with the repository default (read) and both calls fail with
# "Resource not accessible by integration" (see issue #180). Grant only reads.
permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  test-pr-scripts:
    name: Test PR Gate Scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Run workflow script tests
        run: node --test .github/scripts/*.test.cjs

  check-issue-reference:
    name: Check Issue Reference
    runs-on: ubuntu-latest
    outputs:
      references: ${{ steps.parse.outputs.references }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Verify PR links an issue
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const { parseLinkedIssues } = require(
              `${process.env.GITHUB_WORKSPACE}/.github/scripts/parse-linked-issues.cjs`
            );

            // One parse seam: HTML comments and fenced code are ignored, malformed,
            // cross-repo and ambiguous references fail closed (issue #1700).
            const { references, errors } = parseLinkedIssues(context.payload.pull_request.body || '');
            core.setOutput('references', JSON.stringify(references));

            if (errors.length > 0) {
              core.setFailed(
                '❌ PR body has invalid or ambiguous issue references:\n' +
                errors.map((e) => `  - ${e.raw}: ${e.reason}`).join('\n') +
                '\n\nAccepted forms (reviewer-visible text only):\n' +
                '  - Closes/Fixes/Resolves #<number> (closes the issue on merge)\n' +
                '  - Refs #<number> (non-closing link to an issue)'
              );
              return;
            }

            if (references.length === 0) {
              core.setFailed(
                '❌ PR must reference an approved issue.\n' +
                'Add "Closes #N", "Fixes #N", "Resolves #N" or "Refs #N" to the PR body.\n' +
                'References inside HTML comments (<!-- ... -->) or code fences do not count.\n' +
                'See CONTRIBUTING.md for the full contribution workflow.'
              );
            } else {
              core.info(`✅ Found issue reference(s): ${references.map((r) => `#${r.number} (${r.kind})`).join(', ')}`);
            }

  check-issue-approved:
    name: Check Issue Has status:approved
    runs-on: ubuntu-latest
    needs: check-issue-reference
    steps:
      - name: Verify linked issue is approved
        uses: actions/github-script@v7
        env:
          REFERENCES: ${{ needs.check-issue-reference.outputs.references }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Reuse the parse output of the previous job; never re-scan the raw body.
            const references = JSON.parse(process.env.REFERENCES || '[]');

            if (references.length === 0) {
              core.setFailed('❌ No issue reference found in PR body.');
              return;
            }

            const failures = [];

            // context.repo is the base repo on pull_request events; all references resolve there.
            for (const { number: issueNumber } of references) {
              core.info(`Checking issue #${issueNumber} for status:approved label...`);

              let issue;
              try {
                const response = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber,
                });
                issue = response.data;
              } catch (err) {
                failures.push(`Issue #${issueNumber}: could not be fetched (${err.message})`);
                continue;
              }

              const labels = issue.labels.map(l => l.name);
              core.info(`Issue #${issueNumber} labels: ${labels.join(', ') || '(none)'}`);

              if (!labels.includes('status:approved')) {
                failures.push(
                  `Issue #${issueNumber} ("${issue.title}") does not have the \`status:approved\` label. ` +
                  `A maintainer must approve the issue before a PR can be merged.`
                );
              } else {
                core.info(`✅ Issue #${issueNumber} has status:approved`);
              }
            }

            if (failures.length > 0) {
              core.setFailed('❌ Linked issue(s) not approved:\n' + failures.join('\n'));
            }

  check-type-label:
    name: Check PR Has type:* Label
    runs-on: ubuntu-latest
    steps:
      - name: Verify PR has a type label
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = context.payload.pull_request.number;

            const { data: pullRequest } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });

            const labels = pullRequest.labels.map(l => l.name);
            core.info(`PR #${prNumber} labels: ${labels.join(', ') || '(none)'}`);

            const typeLabels = labels.filter(l => l.startsWith('type:'));

            if (typeLabels.length === 0) {
              core.setFailed(
                '❌ PR must have exactly one type:* label.\n' +
                'Valid types: type:bug, type:feature, type:docs, type:refactor, type:chore, type:breaking-change\n' +
                'Add the label to the PR after opening it.'
              );
            } else if (typeLabels.length > 1) {
              core.setFailed(
                `❌ PR has multiple type:* labels: ${typeLabels.join(', ')}.\n` +
                'Please keep exactly one type label.'
              );
            } else {
              core.info(`✅ PR has type label: ${typeLabels[0]}`);
            }
