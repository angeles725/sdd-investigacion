name: toolbelt tests

on:
  push:
    paths:
      - "research-sdd/toolbelt/**"
      - "research-sdd/install/**"
      # gen-catalog.py is now load-bearing for the toolbelt discriminator; changes to either copy
      # (the shipped seed or the repo-specialized tool) must run the guarding tests so BLOCK_RE can't rot.
      - "research-sdd/templates/**"   # seed copy: research-sdd/templates/gen-catalog.py
      - "tools/**"                    # repo-specialized copy: tools/gen-catalog.py (parity target)
      - ".github/workflows/toolbelt-tests.yml"
      # .claude/settings.json holds SessionStart hook command paths; changes must run the suite.
      # harness-sweep-parity.test.sh guards this file via --list-inputs (ci-path-filter-coverage).
      - ".claude/settings.json"
  pull_request:
    paths:
      - "research-sdd/toolbelt/**"
      - "research-sdd/install/**"
      - "research-sdd/templates/**"
      - "tools/**"
      - ".github/workflows/toolbelt-tests.yml"
      - ".claude/settings.json"

jobs:
  toolbelt-tests:
    runs-on: ubuntu-latest
    # kit issue #1144: run-all.sh now discovers AND runs research-sdd/install/tests/*.test.sh
    # itself (a separate "Corpus: install tests" line in its aggregate), so the install suite's
    # ~11-13s moved INTO this step instead of running a second time in its own step below. Raised
    # from 10 -> 12 for headroom: the toolbelt-only step was already measured at 7:44-8:15 against
    # the old 10-minute cap before the install suite's time moved in here.
    # 12 -> 20 (2026-10-01): successful runs had reached 11:12-11:29 and every run after the
    # merge-gate / lint-block / retro-gate suites landed was cancelled at the 12-minute cap
    # (main included) — a cancelled gate proves nothing. Runtime budget tracked separately.
    # 20 -> 35 (2026-10-02, #1437): successful runs took 14-20 min and 5 of 13 runs were cancelled
    # at the 20-minute cap, including PR #1435 at 20:17 while the same head passed in 14:00.
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Sanity-check python3
        run: python3 --version

      - name: Run toolbelt + install test suites
        # research-sdd/install/tests/*.test.sh runs INLINE here (kit issue #1126/#1144) — no
        # separate step; a stand-alone "Run install test suite" step here would just re-run the
        # exact same suite a second time for no additional coverage.
        run: bash research-sdd/toolbelt/tests/run-all.sh --prove-teeth

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Lint toolbelt shell scripts (warning+)
        run: |
          shellcheck --version
          find research-sdd/toolbelt research-sdd/install -name '*.sh' -print0 | xargs -0 shellcheck -S warning
