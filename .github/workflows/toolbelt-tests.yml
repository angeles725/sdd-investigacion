# Every edit to this file MUST refresh research-sdd/toolbelt/tests/fixtures/merge-gate/wf-real-toolbelt-tests.yml in the same commit (cp it over; byte-equality test in merge-gate.test.sh).
name: toolbelt tests

on:
  push:
    paths:
      - "research-sdd/toolbelt/**"
      - "research-sdd/install/**"
      # gen-catalog.py is now load-bearing for the toolbelt discriminator; changes to either copy
      # (the shipped seed or the repo-specialized tool) must run the guarding tests so BLOCK_RE can't rot.
      - "research-sdd/templates/**"   # seed copy: research-sdd/templates/gen-catalog.py
      - "tools/**"                    # repo-specialized copy: tools/gen-catalog.py (parity target)
      - ".github/workflows/toolbelt-tests.yml"
      # Go module rsdd: rsdd-go.test.sh (bridge suite) runs `go test ./...` there.
      - "research-sdd/rsdd/**"
      # .claude/settings.json holds SessionStart hook command paths; changes must run the suite.
      # harness-sweep-parity.test.sh guards this file via --list-inputs (ci-path-filter-coverage).
      - ".claude/settings.json"
      # Doctrine files that suites read from the real tree (verify-doc-consistency, skill-invariants,
      # hotcore-budget, profile-invariants, verify-skill-drift, ...). Chosen over a separate light job:
      # those suites are spread across many files, so a hand-picked subset would itself drift; the
      # whole-suite cost on doc PRs (~15-20 min) is accepted. Derived and enforced by
      # ci-path-filter-coverage.test.sh (doc-consistency section).
      - "research-sdd/METHODOLOGY.md"
      - "research-sdd/PROMPT-LOOP.md"
      - "research-sdd/PROMPT-LOOP-APPENDIX.md"
      - "research-sdd/skills/**"
      - "research-sdd/profiles/**"
      - "research-sdd/agents/**"
  pull_request:
    paths:
      - "research-sdd/toolbelt/**"
      - "research-sdd/install/**"
      - "research-sdd/templates/**"
      - "tools/**"
      - ".github/workflows/toolbelt-tests.yml"
      # Go module rsdd: rsdd-go.test.sh (bridge suite) runs `go test ./...` there.
      - "research-sdd/rsdd/**"
      - ".claude/settings.json"
      - "research-sdd/METHODOLOGY.md"
      - "research-sdd/PROMPT-LOOP.md"
      - "research-sdd/PROMPT-LOOP-APPENDIX.md"
      - "research-sdd/skills/**"
      - "research-sdd/profiles/**"
      - "research-sdd/agents/**"

  # Kit issue #2203: the extras tier (category E VM/dynamic sandbox suites and unused adapters, listed in
  # research-sdd/toolbelt/tests/suite-tiers.txt) is OUT of the default gate and runs here instead: nightly and on
  # demand. These triggers carry no path filter, so on schedule/dispatch the core shard + join jobs below run
  # as well (a nightly core run of main) and the `toolbelt-extras` job runs ONLY on these two triggers.
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

env:
  # Number of shards of the toolbelt gate (kit issue #2114). MUST equal the length of the matrix
  # below: the shard job asserts it against strategy.job-total and the join job passes it to
  # shard-join.sh --shards, so a matrix edit that forgets this value fails loudly.
  SHARD_COUNT: "4"

jobs:
  toolbelt-shard:
    # Kit issue #2114: the single toolbelt-tests job reached the 35-minute cap (25-34 min measured
    # over ~40 runs, 7 cancelled at 35:00; raised to 50 in #2115 as a stop-gap). The gate now runs as
    # a matrix of SHARD_COUNT shards, each `run-all.sh --shard I/N` (a deterministic round-robin slice of the
    # full sorted suite list across BOTH corpora), and the `toolbelt-tests` job below joins them.
    # Measured before sharding: the whole list took 25-34 min of wall time at -j 4 on one runner, so
    # each of 4 shards should take ~7-9 min of suite time plus ~1-2 min setup. timeout-minutes 25 leaves ~2.5x headroom per shard and a
    # cancelled shard fails the join (needs.result != success), so a timeout can never read as green.
    # History of the single-job cap: 12 -> 20 (2026-10-01) -> 35 (2026-10-02, #1437) -> 50 (2026-10-10, #2114/#2115).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # Every shard must finish so the join reports ALL missing/failed suites in one pass.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      # Kit issue #2138 / CLAUDE.md section 7: a suite whose prerequisite is missing must FAIL in CI, never
      # print a typed SKIP that reads as coverage. Suites honouring these flags fail instead of skipping:
      # verify-session-budget.test.sh (RSDD_REQUIRE_BWRAP) and the pi-hooks behavior suite (RSDD_REQUIRE_NODE_TS,
      # honoured once PR #2137 lands).
      RSDD_REQUIRE_BWRAP: "1"
      RSDD_REQUIRE_NODE_TS: "1"
      # rsdd-go.test.sh: a missing Go toolchain must FAIL, never print a typed SKIP that reads as coverage.
      RSDD_REQUIRE_GO: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check the matrix length matches SHARD_COUNT
        run: |
          if [ "${{ strategy.job-total }}" != "$SHARD_COUNT" ]; then
            echo "::error::matrix has ${{ strategy.job-total }} shard(s) but SHARD_COUNT=$SHARD_COUNT"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          # >= 22.18 so `process.features.typescript` (native type stripping, kit issue #2138) is on without a flag;
          # 24 is the current LTS line.
          node-version: "24"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: research-sdd/rsdd/go.mod
          cache-dependency-path: research-sdd/rsdd/go.mod

      - name: Install bubblewrap and enable unprivileged user namespaces
        # Kit issue #2138: verify-session-budget.test.sh and verify-registry case 2129a need a USABLE
        # unprivileged bwrap, or they SKIP. ubuntu-24.04 restricts unprivileged user namespaces through
        # AppArmor (kernel.apparmor_restrict_unprivileged_userns=1), so lift that restriction on this
        # ephemeral runner (documented Ubuntu adjustment; the sysctl is absent on older kernels -> ignored),
        # then prove bwrap works with the same probe the suites use.
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version
          bwrap --ro-bind / / true || { echo "::error::bubblewrap cannot create an unprivileged sandbox on this runner"; exit 1; }

      - name: Sanity-check python3
        run: python3 --version

      - name: Install GNU parallel
        # run-all.sh -j needs GNU parallel; without it the run degrades to serial with a typed
        # DEGRADED line (kit issue #1672) — the check step below makes that a hard failure here.
        run: sudo apt-get update -qq && sudo apt-get install -y -qq parallel && parallel --version | head -n 1

      - name: Run toolbelt + install test suites (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        # research-sdd/install/tests/*.test.sh runs INLINE (kit issue #1126/#1144) — it is part of the
        # full list the shard slices, so no separate step.
        # -j 4 (kit issue #1672): GitHub-hosted ubuntu runners have 4 vCPUs. The unsharded serial run
        # stays the reference for the local quiet-tree gate (CLAUDE.md section 5); CI is not that gate.
        # The manifest (one `<suite> <PASS|FAIL|SKIP>` line per suite plus an exit-code header) is what
        # the join job checks; it is uploaded below even when this step fails.
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/manifest"
          bash research-sdd/toolbelt/tests/run-all.sh --tier core --prove-teeth -j 4 \
            --shard "${{ matrix.shard }}/$SHARD_COUNT" --shard-manifest "$RUNNER_TEMP/manifest/manifest.txt" \
            2>&1 | tee "$RUNNER_TEMP/run-all.log"
          # A silent fallback to serial would hide the cap problem again: require the Parallel line
          # (printed by run-all.sh only in -j mode; search 'echo "Parallel: -j' there).
          grep -q '^Parallel: -j 4' "$RUNNER_TEMP/run-all.log" \
            || { echo "::error::run-all did not run in parallel mode (see DEGRADED line above)"; exit 1; }

      - name: Upload shard manifest
        # always(): a failing shard still uploads its manifest (header exit=RC) so the join names it.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shard-manifest-${{ matrix.shard }}
          path: ${{ runner.temp }}/manifest/manifest.txt
          # A re-run of failed jobs uploads the same artifact name again; replace, do not fail.
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  toolbelt-tests:
    # The JOIN job, deliberately carrying the pre-sharding job name `toolbelt-tests`: merge-gate.sh
    # requires the check `toolbelt-tests` by default (MERGE_GATE_REQUIRED_CHECKS, default
    # `shellcheck,toolbelt-tests`). Branch protection / rulesets on main were queried on 2026-10-10
    # (`gh api .../branches/main/protection` -> 404 "Branch not protected"; `.../rulesets` -> []),
    # so nothing server-side pins the name today, but merge-gate does and so does the PR history.
    # if: always() so a failed/cancelled shard produces a RED join instead of a skipped one (a
    # skipped required check can read as passing). The checkout, download and join steps run first
    # (download and join with if: always()) so every finding is printed even when a shard failed;
    # the LAST step then fails the job on any non-success shard result. Anti-silent-zero
    # (CLAUDE.md section 7): shard-join.sh exits 0 only when every suite of the full list ran exactly
    # once, in a complete set of green shards.
    # NOTE: the shard job above deliberately has NO `name:` line: merge-gate.sh's workflow parser
    # treats any job `name:` containing `${{` as unparseable and then refuses every doc-only PR with
    # ci_missing. GitHub names matrix jobs `toolbelt-shard (1)` by itself.
    needs: toolbelt-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download shard manifests
        if: always()
        uses: actions/download-artifact@v4
        with:
          pattern: shard-manifest-*
          path: manifests

      - name: Join - every suite ran exactly once and passed
        if: always()
        # The glob matches nothing if no artifact arrived -> shard-join.sh reports ABSENT (never a pass).
        # --tier core: the shards above ran the core tier (kit issue #2203), so the expected list is the core list.
        run: bash research-sdd/toolbelt/tests/shard-join.sh --tier core --shards "$SHARD_COUNT" manifests/shard-manifest-*/manifest.txt

      - name: Require every shard job green
        # Last on purpose: the join output above is printed first. A cancelled/failed shard is red here.
        if: always()
        run: |
          if [ "${{ needs.toolbelt-shard.result }}" != "success" ]; then
            echo "::error::toolbelt-shard result is '${{ needs.toolbelt-shard.result }}' (need success for every shard)"
            exit 1
          fi

  toolbelt-extras:
    # Kit issue #2203: the opt-in extras tier (research-sdd/toolbelt/tests/suite-tiers.txt), run nightly and on
    # demand, never on PR/push. Not sharded: `run-all.sh --tier extras --prove-teeth -j 4` is one job. Not part
    # of the required `toolbelt-tests` check; a red nightly is a signal to fix or retire the suite. It has NO
    # `name:` line (see the shard job note about merge-gate's parser).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Same prerequisite-must-not-skip flags as the shard job (kit issue #2138).
      RSDD_REQUIRE_BWRAP: "1"
      RSDD_REQUIRE_NODE_TS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install bubblewrap and enable unprivileged user namespaces
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --version
          bwrap --ro-bind / / true || { echo "::error::bubblewrap cannot create an unprivileged sandbox on this runner"; exit 1; }

      - name: Sanity-check python3
        run: python3 --version

      - name: Install GNU parallel
        run: sudo apt-get update -qq && sudo apt-get install -y -qq parallel && parallel --version | head -n 1

      - name: Run the extras tier
        run: |
          set -o pipefail
          bash research-sdd/toolbelt/tests/run-all.sh --tier extras --prove-teeth -j 4 2>&1 | tee "$RUNNER_TEMP/run-all-extras.log"
          grep -q '^Parallel: -j 4' "$RUNNER_TEMP/run-all-extras.log" \
            || { echo "::error::run-all did not run in parallel mode (see DEGRADED line above)"; exit 1; }

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Lint toolbelt shell scripts (warning+)
        run: |
          shellcheck --version
          find research-sdd/toolbelt research-sdd/install -name '*.sh' -print0 | xargs -0 shellcheck -S warning

      - name: Lint shell-portability defect classes (unquoted subst replacement, awk intervals)
        # Unwired-mechanisms audit 2026-10-05: lint-substitution.sh (kit issue #1121/#1142) scans
        # the kit's own toolbelt + install *.sh and exits 1 on a violation (measured 0 on 284 files).
        # ci-workflow-lint-substitution.test.sh fails if this step is removed.
        run: bash research-sdd/toolbelt/lint-substitution.sh

      - name: Check kit doc consistency (METHODOLOGY vs SKILL/PROMPT-LOOP/README)
        # Unwired-mechanisms audit 2026-10-05 (kit issue #1817): verify-doc-consistency.sh is WARN-only
        # (exit 0 on findings, 1 only on operational failure), so this step fails on any WARN line
        # explicitly. WARN findings go to stdout (stderr carries only operational errors); 2>&1 captures
        # both anyway, and pipefail makes an operational failure (script exit 1) fail the step instead
        # of reading as clean. Measured 0 findings on the real tree after the SKILL.md example-path
        # rewording. ci-workflow-doc-consistency.test.sh fails if this step is removed or weakened.
        run: |
          set -o pipefail
          bash research-sdd/toolbelt/verify-doc-consistency.sh 2>&1 | tee "$RUNNER_TEMP/doc-consistency.log"
          if grep -q '^WARN' "$RUNNER_TEMP/doc-consistency.log"; then
            echo "::error::verify-doc-consistency reported findings (see WARN lines above)"
            exit 1
          fi
