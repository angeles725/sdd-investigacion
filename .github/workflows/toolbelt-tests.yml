name: toolbelt tests

on:
  push:
    paths:
      - "research-sdd/toolbelt/**"
      - "research-sdd/install/**"
      # gen-catalog.py is now load-bearing for the toolbelt discriminator; changes to either copy
      # (the shipped seed or the repo-specialized tool) must run the guarding tests so BLOCK_RE can't rot.
      - "research-sdd/templates/**"   # seed copy: research-sdd/templates/gen-catalog.py
      - "tools/**"                    # repo-specialized copy: tools/gen-catalog.py (parity target)
      - ".github/workflows/toolbelt-tests.yml"
      # .claude/settings.json is a harness input for harness-sweep-parity.test.sh (SessionStart
      # hook command paths).  Missing this entry caused PR #108 to merge without running the suite.
      - ".claude/settings.json"
  pull_request:
    paths:
      - "research-sdd/toolbelt/**"
      - "research-sdd/install/**"
      - "research-sdd/templates/**"
      - "tools/**"
      - ".github/workflows/toolbelt-tests.yml"
      - ".claude/settings.json"

jobs:
  toolbelt-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Sanity-check python3
        run: python3 --version

      - name: Run toolbelt test suites
        run: bash research-sdd/toolbelt/tests/run-all.sh --prove-teeth

      - name: Run install test suite
        run: bash research-sdd/install/tests/research-sdd-install.test.sh --prove-teeth

  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Lint toolbelt shell scripts (warning+)
        run: |
          shellcheck --version
          find research-sdd/toolbelt research-sdd/install -name '*.sh' -print0 | xargs -0 shellcheck -S warning
