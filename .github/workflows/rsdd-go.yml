name: rsdd-go

on:
  push:
    branches: [main]
    paths:
      - "research-sdd/rsdd/**"
      - ".github/workflows/rsdd-go.yml"
      # The Go bridge suite (kit issue #2488) and the mutation helper it sources.
      - "research-sdd/toolbelt/tests/rsdd-go.test.sh"
      - "research-sdd/toolbelt/tests/lib/mutant.sh"
  pull_request:
    paths:
      - "research-sdd/rsdd/**"
      - ".github/workflows/rsdd-go.yml"
      - "research-sdd/toolbelt/tests/rsdd-go.test.sh"
      - "research-sdd/toolbelt/tests/lib/mutant.sh"
  # Nightly whole-module run of the bridge suite (whole-module gremlins; RSDD_TEETH_BASE is empty on schedule/dispatch).
  # The toolbelt nightly used to cover this through its core tier; the suite is now `dedicated` (suite-tiers.txt).
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

# A newer push to the same PR, or a newer merge to main, supersedes the in-flight run of the same ref:
# cancel it, so the shared concurrent-job cap (GitHub queues everything beyond it) is spent on current
# heads only. On main this coalesces a burst of merges into one run of the newest commit (measured
# 2026-11-02: 21 full toolbelt runs on main pushes in ~22 h, ~46 job-minutes each); every merged commit
# was already gated by its PR run. The event name is in the group, so a merge never cancels the nightly
# schedule or a manual dispatch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rsdd-go:
    runs-on: ubuntu-24.04 # temporary pin, see #2379 (bash 5.3 parity on ubuntu-26.04)
    timeout-minutes: 15
    defaults:
      run:
        working-directory: research-sdd/rsdd
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: research-sdd/rsdd/go.mod
          # The module has no go.sum, so setup-go's own cache (keyed on go.mod) never refreshed ("Cache hit occurred on
          # the primary key ... not saving cache"). The explicit cache step below is keyed on the Go sources (kit issue #2488).
          cache: false
      - name: Cache Go build and module caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          # One key family per job: a shared key would let the first job to save win and starve the others of their own artifacts.
          key: ${{ runner.os }}-go-check-${{ hashFiles('research-sdd/rsdd/**/*.go', 'research-sdd/rsdd/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-check-
      - name: gofmt
        run: make fmt-check
      - name: go vet
        run: go vet ./...
      - name: staticcheck (pinned in the Makefile)
        run: make lint
      - name: go test -race
        run: make race
      - name: cross build (CGO_ENABLED=0)
        run: make cross

  rsdd-go-bridge:
    # Kit issue #2488: research-sdd/toolbelt/tests/rsdd-go.test.sh (tier `dedicated` in suite-tiers.txt, so the
    # toolbelt shards no longer run it) = `make test` + the panic-boundary mutation control + gremlins teeth.
    # Kit issue #2617: `make test` + the panic-boundary control used to run in shard 1 before its teeth (#2598: its
    # gremlins started ~9 min into the job and hit the 25 min cap). They now run in the separate `rsdd-go-test` job
    # (RSDD_BRIDGE_PART=test), parallel to the shards, which run only the teeth (RSDD_BRIDGE_PART=teeth), so all three
    # have the full budget. schedule/workflow_dispatch keep ONE job running both halves (matrix value 0).
    # It used to run inside every toolbelt shard run (469-729 s, 10 of 14 measured toolbelt failures) even when no
    # Go file changed. Same environment it had there.
    # Kit issue #2568: a PR changing several packages ran its per-package gremlins serially and hit the 25 min cap (PR #2562:
    # 7 packages, cancelled during the 7th). pull_request and push split those packages over 3 parallel jobs
    # (RSDD_TEETH_SHARD=I/3). Kit issue #2573: the shard unit is the changed FILE, not the package (PR #2477 changed one
    # package and its gremlins alone hit the cap), so even a one-package change spreads over the 3 jobs (file position mod 3).
    # schedule/workflow_dispatch keep ONE unsharded whole-module job
    # (matrix value 0), still named plain `rsdd-go-bridge`.
    name: ${{ matrix.shard == 0 && 'rsdd-go-bridge' || format('rsdd-go-bridge ({0}/3)', matrix.shard) }}
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '[0]' || '[1,2,3]') }}
    runs-on: ubuntu-24.04 # temporary pin, see #2379 (bash 5.3 parity on ubuntu-26.04)
    # pull_request and push scope gremlins to the changed packages (fits 25 min); schedule/workflow_dispatch run the whole
    # module: a verify-only whole-module run measured 2h54m locally (4 CPUs, heavy-run caps, 2026-11-02), so it gets
    # 360 min (GitHub's maximum, ~2x margin) in one unsharded job (the shard split above applies to the changed-file list only).
    timeout-minutes: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 360 || 25 }}
    env:
      # A missing Go toolchain must FAIL, never print a typed SKIP that reads as coverage (CLAUDE.md section 7).
      RSDD_REQUIRE_GO: "1"
      # Kit issue #2381: on a pull_request, gremlins runs only on the Go packages changed since the merge base with
      # the target branch. On push the step below sets it to the pushed range; empty on schedule/dispatch, which keeps
      # the whole-module run.
      RSDD_TEETH_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
      # Shard I of 3 on pull_request and push; empty (unsharded) on schedule/workflow_dispatch, where matrix.shard is 0.
      RSDD_TEETH_SHARD: ${{ matrix.shard != 0 && format('{0}/3', matrix.shard) || '' }}
      # Kit issue #2617: the shards run only the teeth half (never `make test`, which the rsdd-go-test job runs); the
      # unsharded schedule/dispatch job runs both halves exactly as before (empty = all).
      RSDD_BRIDGE_PART: ${{ matrix.shard != 0 && 'teeth' || '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history on a pull_request or push so origin/<base> / github.event.before and their merge base with HEAD
          # resolve (RSDD_TEETH_BASE).
          fetch-depth: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && '0' || '1' }}
      - name: Scope teeth to the pushed range (push)
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # A first push (all-zero sha) or a force push leaves `before` unresolvable: fall back to the parent commit.
          base="$BEFORE"
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then base="$(git rev-parse HEAD~1)"; fi
          echo "RSDD_TEETH_BASE=$base" >> "$GITHUB_ENV"
          echo "teeth base for this push: $base"
      - uses: actions/setup-go@v5
        with:
          go-version-file: research-sdd/rsdd/go.mod
          cache: false # see the rsdd-go job: go.mod-only keys never refresh (kit issue #2488)
      - name: Cache Go build and module caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-bridge-${{ hashFiles('research-sdd/rsdd/**/*.go', 'research-sdd/rsdd/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-bridge-
      - name: rsdd-go.test.sh with mutation teeth
        run: bash research-sdd/toolbelt/tests/rsdd-go.test.sh --prove-teeth

  rsdd-go-test:
    # Kit issue #2617: the whole-module `make test` and the panic-boundary mutation control of rsdd-go.test.sh, in their
    # own job parallel to the rsdd-go-bridge teeth shards. pull_request and push only: schedule/workflow_dispatch run
    # both halves inside the unsharded `rsdd-go-bridge` job. No gremlins here, so no RSDD_TEETH_BASE and no full history.
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04 # temporary pin, see #2379 (bash 5.3 parity on ubuntu-26.04)
    timeout-minutes: 25
    env:
      RSDD_REQUIRE_GO: "1"
      RSDD_BRIDGE_PART: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: research-sdd/rsdd/go.mod
          cache: false # see the rsdd-go job: go.mod-only keys never refresh (kit issue #2488)
      - name: Cache Go build and module caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-test-${{ hashFiles('research-sdd/rsdd/**/*.go', 'research-sdd/rsdd/go.mod') }}
          restore-keys: |
            ${{ runner.os }}-go-test-
      - name: rsdd-go.test.sh whole-module tests (RSDD_BRIDGE_PART=test)
        run: bash research-sdd/toolbelt/tests/rsdd-go.test.sh --prove-teeth
